<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDFC Active Athletes Weekly Board</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
  }

  .card {
    width: 780px;
    background: linear-gradient(160deg, #1a1a2e 0%, #0d0d1a 60%, #0a0a14 100%);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 460px;
    height: 460px;
    opacity: 0.09;
    pointer-events: none;
    z-index: 0;
    object-fit: contain;
  }

  .header {
    position: relative;
    z-index: 1;
    padding: 28px 36px 20px;
    background: linear-gradient(135deg, rgba(220,30,40,0.25) 0%, rgba(10,50,180,0.2) 100%);
    border-bottom: 2px solid rgba(220,30,40,0.4);
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .header-logo {
    width: 72px;
    height: 72px;
    object-fit: contain;
    filter: drop-shadow(0 4px 12px rgba(220,30,40,0.5));
    flex-shrink: 0;
  }

  .header-text { flex: 1; }

  .club-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .board-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 2px;
    color: #ffffff;
    line-height: 1;
  }

  .board-title span { color: #e81c2e; }

  .col-headers {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 52px 1fr 120px 90px 100px;
    padding: 10px 36px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }

  .col-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }

  .col-label.right { text-align: right; }

  .athletes-list {
    position: relative;
    z-index: 1;
    padding: 8px 0 4px;
  }

  .athlete-row {
    display: grid;
    grid-template-columns: 52px 1fr 120px 90px 100px;
    align-items: center;
    padding: 9px 36px;
    position: relative;
  }

  .athlete-row::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 36px;
    right: 36px;
    height: 1px;
    background: rgba(255,255,255,0.04);
  }

  .rank-cell {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rank-num {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    background: rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.4);
  }

  .athlete-info { display: flex; align-items: center; gap: 12px; }

  .athlete-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.1);
  }

  .athlete-name {
    font-size: 13px;
    font-weight: 700;
    color: #e0e0e0;
    letter-spacing: 0.3px;
  }

  .stat-cell {
    text-align: right;
  }

  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    letter-spacing: 0.5px;
    color: #e8e8e8;
  }

  .stat-unit {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    display: block;
    margin-top: -2px;
  }

  .na-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    color: rgba(255,255,255,0.18);
  }

  .stat-cell.lead-time .stat-value {
    color: #ffd700;
    text-shadow: 0 0 14px rgba(255,215,0,0.55);
  }
  .stat-cell.lead-time .stat-unit { color: rgba(255,215,0,0.5); }
  .stat-cell.lead-time {
    background: rgba(255,215,0,0.07);
    border-radius: 6px;
    padding: 3px 6px;
    margin: -3px 0;
  }

  .stat-cell.lead-act .stat-value {
    color: #60c8ff;
    text-shadow: 0 0 14px rgba(96,200,255,0.55);
  }
  .stat-cell.lead-act .stat-unit { color: rgba(96,200,255,0.5); }
  .stat-cell.lead-act {
    background: rgba(96,200,255,0.07);
    border-radius: 6px;
    padding: 3px 6px;
    margin: -3px 0;
  }

  .stat-cell.lead-dist .stat-value {
    color: #7ae880;
    text-shadow: 0 0 14px rgba(122,232,128,0.55);
  }
  .stat-cell.lead-dist .stat-unit { color: rgba(122,232,128,0.5); }
  .stat-cell.lead-dist {
    background: rgba(122,232,128,0.07);
    border-radius: 6px;
    padding: 3px 6px;
    margin: -3px 0;
  }

  .footer {
    position: relative;
    z-index: 1;
    padding: 14px 36px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.2);
  }

  .footer-text {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .footer-logo-small {
    width: 32px;
    height: 32px;
    object-fit: contain;
    opacity: 0.6;
  }

  .top-bar {
    height: 4px;
    background: linear-gradient(90deg, #dc143c 0%, #003893 50%, #dc143c 100%);
  }

  .tagline {
    font-size: 15px;
    font-weight: 800;
    font-style: italic;
    margin-top: 10px;
    letter-spacing: 0.4px;
    line-height: 1.4;
    color: #ffd700;
    text-shadow: 0 0 18px rgba(255,215,0,0.7), 0 0 40px rgba(255,100,80,0.4);
  }
</style>
</head>
<body>
<div class="card">
  <div class="top-bar"></div>
  <img class="watermark" src="NDFC logo.png" alt="">

  <div class="header">
    <img class="header-logo" id="logoImg" src="" alt="NDFC Logo">
    <div class="header-text">
      <div class="club-name">Nepal Dallas Football Club</div>
      <div class="board-title">Active <span>Athletes</span></div>
      <div class="board-title" style="font-size:22px; margin-top:-4px;">Weekly Board</div>
      <div class="tagline">Together we play. Individually we stay active.</div>
    </div>
  </div>

  <div class="col-headers">
    <div class="col-label" style="text-align:center">#</div>
    <div class="col-label">Athlete</div>
    <div class="col-label right">Time</div>
    <div class="col-label right">Activities</div>
    <div class="col-label right">Distance</div>
  </div>

  <div class="athletes-list" id="athletesList"></div>

  <div class="footer">
    <div class="footer-text">NDFC · Dallas, TX · Est. 2022</div>
    <img class="footer-logo-small" id="footerLogo" src="" alt="NDFC">
  </div>
</div>

<script>
  const logoSrc = 'NDFC logo.png';
  document.getElementById('logoImg').src = logoSrc;
  document.getElementById('footerLogo').src = logoSrc;

const athletes = [
    { rank: 1,  name: "Prajwal Dhungana",  timeMin: 505, timeLabel: "8h 25m", acts: 6, distMi: 8.9, distLabel: "8.9" },
    { rank: 2,  name: "Nishan Budhathoki", timeMin: 471, timeLabel: "7h 51m", acts: 8, distMi: 8.9, distLabel: "8.9" },
    { rank: 3,  name: "Avinna Bhattarai",  timeMin: 426, timeLabel: "7h 6m",  acts: 8, distMi: 1.6, distLabel: "1.6" },
    { rank: 4,  name: "Sajan Gautam",      timeMin: 355, timeLabel: "5h 55m", acts: 6, distMi: 1.0, distLabel: "1.0" },
    { rank: 5,  name: "Biebek C",           timeMin: 347, timeLabel: "5h 47m", acts: 8, distMi: 6.5, distLabel: "6.5" },
    { rank: 6,  name: "Sandesh Khawas B.",  timeMin: 235, timeLabel: "3h 55m", acts: 5, distMi: 14.4, distLabel: "14.4" },
    { rank: 7,  name: "Rozit Basnet",       timeMin: 230, timeLabel: "3h 50m", acts: 3, distMi: null, distLabel: "--" },
    { rank: 8,  name: "Subodh Dhakal",      timeMin: 202, timeLabel: "3h 22m", acts: 3, distMi: 8.5, distLabel: "8.5" },
    { rank: 9,  name: "Krishna Limbu",      timeMin: 169, timeLabel: "2h 49m", acts: 4, distMi: 2.2, distLabel: "2.2" },
    { rank: 10, name: "Samaya B",           timeMin: 145, timeLabel: "2h 25m", acts: 3, distMi: 4.5, distLabel: "4.5" },
    { rank: 11, name: "Rijan Kafle",        timeMin: 121, timeLabel: "2h 1m",  acts: 4, distMi: 0.9, distLabel: "0.9" },
    { rank: 12, name: "Simant Guragai",     timeMin: 46,  timeLabel: "46m",    acts: 2, distMi: 4.2, distLabel: "4.2" },
];

  const maxTime = Math.max(...athletes.map(a => a.timeMin));
  const maxActs = Math.max(...athletes.map(a => a.acts));
  const maxDist = Math.max(...athletes.filter(a => a.distMi !== null).map(a => a.distMi));

  const list = document.getElementById('athletesList');

  athletes.forEach(a => {
    const isLeadTime = a.timeMin === maxTime;
    const isLeadActs = a.acts === maxActs;
    const isLeadDist = a.distMi !== null && a.distMi === maxDist;

    const distHtml = a.distLabel
      ? `<span class="stat-value">${a.distLabel}</span><span class="stat-unit">miles</span>`
      : `<span class="na-val">—</span>`;

    list.innerHTML += `
      <div class="athlete-row">
        <div class="rank-cell"><div class="rank-num">${a.rank}</div></div>
        <div class="athlete-info">
          <div class="athlete-name">${a.name}</div>
        </div>
        <div class="stat-cell ${isLeadTime ? 'lead-time' : ''}">
          <span class="stat-value">${a.timeLabel}</span>
          <span class="stat-unit">time</span>
        </div>
        <div class="stat-cell ${isLeadActs ? 'lead-act' : ''}">
          <span class="stat-value">${a.acts}</span>
          <span class="stat-unit">acts</span>
        </div>
        <div class="stat-cell ${isLeadDist ? 'lead-dist' : ''}">${distHtml}</div>
      </div>`;
  });
</script>
</body>
</html>
